version: "3"

# Works on Linux, macOS and Windows: Task runs every command through its own built-in
# shell, so the same commands apply everywhere; only the venv layout and the system
# python name differ per OS.

vars:
  VENV: '{{.VENV | default ".venv"}}'
  PYTHON: '{{if eq OS "windows"}}{{.VENV}}/Scripts/python.exe{{else}}{{.VENV}}/bin/python{{end}}'
  SYSTEM_PYTHON: '{{.SYSTEM_PYTHON | default (eq OS "windows" | ternary "python" "python3")}}'
  VENV_FIX_HINT: '{{if eq OS "windows"}}install Python 3.10+ (winget install Python.Python.3.12){{else}}on Ubuntu/Debian run `sudo apt install python3-venv`{{end}}'
  FFMPEG_FIX_HINT: '{{if eq OS "windows"}}winget install Gyan.FFmpeg, then open a new terminal{{else}}sudo apt install ffmpeg (macOS: brew install ffmpeg){{end}}'

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

tasks:
  install:
    desc: Create the virtualenv and install Python dependencies
    preconditions:
      - sh: "{{.SYSTEM_PYTHON}} -c 'import sys, venv, ensurepip; sys.exit(sys.version_info < (3, 10))'"
        msg: "{{.SYSTEM_PYTHON}} can't create a Python 3.10+ virtualenv: {{.VENV_FIX_HINT}}, or pass SYSTEM_PYTHON=<python>"
    cmds:
      - "{{.SYSTEM_PYTHON}} -m venv {{.VENV}}"
      - "{{.PYTHON}} -m pip install --upgrade pip"
      - "{{.PYTHON}} -m pip install -r requirements.txt"
    status:
      - test -f {{.PYTHON}}

  clip:
    desc: "Make clips from a URL: task clip URL=<youtube url> [-- extra clip.py flags]"
    deps: [check:tools]
    requires:
      vars: [URL]
    cmds:
      - "{{.PYTHON}} clipper/clip.py --url '{{.URL}}' {{.CLI_ARGS}}"

  clip:section:
    desc: "Clip only part of a long video: task clip:section URL=<url> SECTION=3600-3780"
    deps: [check:tools]
    requires:
      vars: [URL, SECTION]
    cmds:
      - "{{.PYTHON}} clipper/clip.py --url '{{.URL}}' --download-section '{{.SECTION}}' {{.CLI_ARGS}}"

  test:
    desc: Run the integration tests
    deps: [check:tools]
    cmds:
      - "{{.PYTHON}} -m pytest -q clipper/tests {{.CLI_ARGS}}"

  validate:
    desc: Render the reference inputs and print each preview.jpg to check by eye (see TESTING.md)
    deps: [check:tools]
    cmds:
      - "{{.PYTHON}} clipper/validate.py {{.CLI_ARGS}}"

  check:tools:
    internal: true
    preconditions:
      - sh: test -f {{.PYTHON}}
        msg: "No virtualenv at {{.VENV}}: run `task install` (or pass VENV=<path>)"
      - sh: ffmpeg -hide_banner -version > /dev/null && ffprobe -hide_banner -version > /dev/null
        msg: "ffmpeg and ffprobe must be on PATH: {{.FFMPEG_FIX_HINT}}"
