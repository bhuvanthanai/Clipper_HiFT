version: "3"

vars:
  VENV: '{{.VENV | default ".venv"}}'
  PYTHON: '{{if eq OS "windows"}}{{.VENV}}/Scripts/python.exe{{else}}{{.VENV}}/bin/python{{end}}'
  SYSTEM_PYTHON: '{{.SYSTEM_PYTHON | default (eq OS "windows" | ternary "python" "python3")}}'

tasks:
  install:
    desc: Create the virtualenv and install Python dependencies
    preconditions:
      - sh: "{{.SYSTEM_PYTHON}} -c 'import venv, ensurepip'"
        msg: "{{.SYSTEM_PYTHON}} can't create virtualenvs: on Ubuntu/Debian run `sudo apt install python3-venv`, or pass SYSTEM_PYTHON=<python with venv>"
    cmds:
      - "{{.SYSTEM_PYTHON}} -m venv {{.VENV}}"
      - "{{.PYTHON}} -m pip install --upgrade pip"
      - "{{.PYTHON}} -m pip install -r requirements.txt"
    status:
      - test -x {{.PYTHON}}

  clip:
    desc: "Make clips from a URL: task clip URL=<youtube url> [-- extra clip.py flags]"
    deps: [check:tools]
    requires:
      vars: [URL]
    cmds:
      - "{{.PYTHON}} clipper/clip.py --url '{{.URL}}' {{.CLI_ARGS}}"

  clip:section:
    desc: "Clip only part of a long video: task clip:section URL=<url> SECTION=3600-3780"
    deps: [check:tools]
    requires:
      vars: [URL, SECTION]
    cmds:
      - "{{.PYTHON}} clipper/clip.py --url '{{.URL}}' --download-section '{{.SECTION}}' {{.CLI_ARGS}}"

  test:
    desc: Run the integration tests
    deps: [check:tools]
    cmds:
      - "{{.PYTHON}} -m pytest -q clipper/tests {{.CLI_ARGS}}"

  validate:
    desc: Render the reference inputs and print each preview.jpg to check by eye (see TESTING.md)
    deps: [check:tools]
    cmds:
      - "{{.PYTHON}} clipper/validate.py {{.CLI_ARGS}}"

  check:tools:
    internal: true
    preconditions:
      - sh: test -x {{.PYTHON}}
        msg: "No virtualenv at {{.VENV}}: run `task install` (or pass VENV=<path>)"
      - sh: command -v ffmpeg && command -v ffprobe
        msg: "ffmpeg and ffprobe must be on PATH"
